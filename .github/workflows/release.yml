# Releases oganesson when a release-* tag is pushed, or by hand: builds, tests and publishes Linux
# and Windows as README "Releasing" does, then posts a GitHub release with the packages and notes
# from the commits since the previous one. A merge to main releases nothing. The run releases main's
# tip, which must contain the tagged commit. It runs on the project's own build machine (runner
# label "oganesson"), in the main checkout, which has the build tree and the publish settings. Pull
# requests start nothing: a runner on this machine must never run their code.
name: Release
on:
  push:
    tags: ['release-*']
  workflow_dispatch:
# One run at a time, and GitHub keeps only the newest waiting run, so several tags pushed during a
# run start one more release, not one each.
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
# The runner's .env sets MAIN, the main checkout, and BUILDS_LOCK, which allows one browser build
# at a time on the machine, whichever repo's release starts it.
jobs:
  release:
    runs-on: [self-hosted, oganesson]
    timeout-minutes: 1440
    steps:
      - name: Main checkout at main's tip
        run: |
          : "${MAIN:?must be set in the .env of the runner}" "${BUILDS_LOCK:?must be set in the .env of the runner}"
          cd "$MAIN"
          git fetch -q origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit of main"
            exit 1
          fi
          git merge -q --ff-only origin/main
          # The scores that an earlier run wrote ("Firefox's WebExtensions tests", "Firefox add-ons
          # corpus").
          if [ -e dubna/.git ]; then git -C dubna checkout -q -- webextensions/score; fi
          git submodule update --init -q
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # What firefox-add-ons.patch adds is Firefox add-ons' alone (dubna's webextensions/README.md,
      # "Firefox add-ons only"): about a second, no browser.
      - name: Firefox add-ons only
        run: cd "$MAIN" && python3 dubna/tools/firefox_gates.py
      - name: Linux build and browser tests
        run: cd "$MAIN" && flock "$BUILDS_LOCK" sh -c './oganesson.py build --release && ./oganesson.py test --release'
      # All of Firefox's ported WebExtensions tests (dubna's webextensions/README.md, "Test
      # score"), before Windows takes the builds lock: a test that passed in the score committed
      # in dubna and fails now stops the release (exit 3). The run takes the lock itself. It
      # writes the new score in the dubna submodule, where the release notes read it, and a copy
      # goes to work/release-scores/ for the stage that tagged to commit to dubna.
      - name: Firefox's WebExtensions tests
        run: |
          cd "$MAIN"
          python3 tools/e2e/firefox_tests.py
          mkdir -p work/release-scores
          cp dubna/webextensions/score/oganesson-firefox-tests.json work/release-scores/
      # Chromium's own extension API tests as Chrome extensions (tools/e2e/chromium_tests.py):
      # each one that passes in stock Helium of the same Chromium, as dubna's
      # webextensions/chromium-tests.json says, has to pass here, or the release stops (exit 3).
      # The run takes the lock itself.
      - name: Chromium's extension API tests
        run: cd "$MAIN" && python3 tools/e2e/chromium_tests.py
      # The full corpus of AMO add-ons (dubna's webextensions/README.md, "Corpus score"), also
      # before Windows: an add-on that is lower than in the score committed in dubna, also after
      # a second run of it, stops the release (exit 1). The run takes the lock itself; a flock
      # around it would wait for itself. It reads the .xpi files from the runner's cache of dubna's
      # tools/amo_corpus.py fetch, writes the new score in the dubna submodule, and a copy goes to
      # work/release-scores/ for the stage that tagged to commit to dubna.
      - name: Firefox add-ons corpus
        run: |
          cd "$MAIN"
          python3 tools/e2e/corpus.py
          cp dubna/webextensions/score/oganesson.json work/release-scores/
      # Windows builds while Linux packs and uploads, which leave most CPUs idle. Its own session,
      # so the step's end doesn't stop it; the job's end does. Its log and exit code go to work/,
      # for the Windows step to wait on.
      - name: Windows build, in the background
        run: |
          cd "$MAIN"
          rm -f work/windows-build.code
          setsid nohup sh -c 'flock "$BUILDS_LOCK" ./oganesson.py build --windows; echo $? > work/windows-build.code' \
              > work/windows-build.log 2>&1 < /dev/null &
      - name: Linux packages
        run: |
          cd "$MAIN" && linux/pack.sh
          version="$(cat helium/chromium_version.txt)"
          release="1.$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "TAG=v$version-$release" >> "$GITHUB_ENV"
      # The GitHub release comes first: it holds the files, and the repository and the site point
      # at them.
      - name: GitHub release, with the Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$MAIN"
          linux="work/dl/$VERSION-$RELEASE"
          assets=("$linux"/*.deb "$linux"/*.rpm "$linux"/oganesson-"$VERSION"-*_linux.tar.xz)
          dubna/tools/release_notes.py . --skip docs/ '*.md' .github/ tools/ oganesson.py \
              linux/container-build.sh linux/pack.sh linux/publish-repo.sh windows/container-build.sh \
              windows/build-sync-lib.sh windows/make_toolchain.py windows/publish.sh windows/Dockerfile \
              windows/vm/ > work/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$RELEASE_SHA" \
                --title "oganesson $VERSION ($RELEASE)" --notes-file work/release-notes.md
          fi
      # The token is for the download links that let the server fetch the packages from the
      # GitHub release (tools/from-github.sh).
      - name: Linux packages, to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd "$MAIN" && linux/publish-repo.sh
      - name: Windows packages, to the GitHub release and the site
        id: windows
        # A Windows failure (helium-windows behind, say) doesn't hold back Linux's release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$MAIN"
          timeout 3h sh -c 'until [ -f work/windows-build.code ]; do sleep 10; done'
          cat work/windows-build.log
          [ "$(cat work/windows-build.code)" = 0 ]
          win="work/dl/windows/$VERSION-$RELEASE"
          gh release upload "$TAG" "$win"/*-installer.exe "$win"/*-windows-x64.zip --clobber
          windows/publish.sh
      - name: GitHub release, noting a failed Windows build
        if: steps.windows.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$MAIN"
          printf '\nThe Windows build failed; this release has the Linux packages only.\n' >> work/release-notes.md
          gh release edit "$TAG" --notes-file work/release-notes.md
      # The new scores are in work/release-scores/ and the notes are posted, so the dubna
      # submodule goes back to its commit: left changed, it stops the main checkout's post-merge
      # hook from moving dubna until the next release.
      - name: Scores out of the dubna submodule
        run: cd "$MAIN" && git -C dubna checkout -q -- webextensions/score
